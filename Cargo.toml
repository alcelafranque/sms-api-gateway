[workspace]
resolver = "3"
members = ["crates/tplink-ex", "crates/modem", "crates/gateway"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/alcelafranque/sms-api-gateway"

[workspace.dependencies]
tplink-ex = { path = "crates/tplink-ex" }
modem = { path = "crates/modem" }

async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
