[package]
name = "gateway"
description = "HTTP SMS gateway in front of an SMS-capable modem"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sms-gateway"
path = "src/main.rs"

[dependencies]
modem.workspace = true

anyhow = "1.0.100"
async-trait.workspace = true
axum = { version = "0.8.8", features = ["macros"] }
base64 = "0.22.1"
chrono.workspace = true
chrono-tz = "0.10.4"
clap = { version = "4.5", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
hex = "0.4.3"
hmac = "0.12.1"
metrics = "0.24.2"
metrics-exporter-prometheus = { version = "0.18.1", default-features = false }
phonenumber = "0.3.9"
rand = "0.9.2"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
subtle = "2.6.1"
thiserror.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7.15", features = ["rt"] }
tower-http = { version = "0.6.6", features = ["trace", "timeout", "limit", "request-id", "util"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
uuid = { version = "1.18", features = ["v4", "v7", "serde"] }

[dev-dependencies]
figment = { version = "0.10.19", features = ["test"] }
tower = { version = "0.5.2", features = ["util"] }
