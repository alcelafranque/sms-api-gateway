[package]
name = "tplink-ex"
description = "Client for the cgi_gdpr web API of TP-Link EX/MR-family CPEs (NE200-Outdoor...)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["tp-link", "sms", "lte", "router", "cpe"]
categories = ["api-bindings", "network-programming"]

[dependencies]
aes = "0.8.4"
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
base64 = "0.22.1"
cbc = { version = "0.1.2", features = ["alloc", "block-padding"] }
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
md-5 = "0.10.6"
num-bigint = "0.4.8"
rand = "0.9.2"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "cookies"] }
serde_json = "1.0.140"
sha1 = "0.10.6"
thiserror = "2.0.12"
tokio = { version = "1.45.0", features = ["time"] }
tracing = "0.1.41"

[dev-dependencies]
tokio = { version = "1.45.0", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
